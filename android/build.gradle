// The Android Gradle Plugin builds the native code with the Android NDK.

group 'org.tensorflow.tflite_flutter'
version '1.0'

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Required so that `apply plugin: 'kotlin-android'` below can resolve,
        // which in turn is what provides the `kotlinOptions` block.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
// This plugin contributes the `kotlinOptions` extension used below, and pins an
// explicit jvmTarget. Without it, newer Flutter versions auto-apply KGP with no
// jvmTarget, which then defaults to whatever JDK runs Gradle and breaks with
// "Inconsistent JVM-target compatibility detected".
apply plugin: 'kotlin-android'

android {
    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 36
    namespace 'org.tensorflow.tflite_flutter'

    // Bumping the plugin ndkVersion requires all clients of this plugin to bump
    // the version in their app and to download a newer version of the NDK.
    // ndkVersion "29.0.14206865"

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        // cmake {
        //     path "../src/CMakeLists.txt"

        //     // The default CMake version for the Android Gradle Plugin is 3.10.2.
        //     // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
        //     //
        //     // The Flutter tooling requires that developers have CMake 3.10 or later
        //     // installed. You should not increase this version, as doing so will cause
        //     // the plugin to fail to compile for some customers of the plugin.
        //     // version "3.10.2"
        // }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdkVersion 19
    }
}


dependencies {
    //def tflite_version = "2.13.0"
/*
    implementation("org.tensorflow:tensorflow-lite:${tflite_version}")
    implementation("org.tensorflow:tensorflow-lite-gpu:${tflite_version}")
    implementation("org.tensorflow:tensorflow-lite-gpu-api:${tflite_version}")
*/
    def litert_version = "1.4.0"

    implementation("com.google.ai.edge.litert:litert:${litert_version}")
    implementation("com.google.ai.edge.litert:litert-gpu:${litert_version}")
}
